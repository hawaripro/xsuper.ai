<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffffff 0%, #fef2f2 50%, #fff7ed 100%);
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
}
/* Dot pattern */
body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(239, 68, 68, 0.15) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.6;
}
/* Red glow */
.glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.3;
}
.glow-1 { top: -150px; right: -100px; background: #ef4444; }
.glow-2 { bottom: -150px; left: -100px; background: #f97316; }
.content {
    position: relative;
    text-align: center;
    z-index: 1;
}
.logo {
    width: 120px;
    height: 120px;
    border-radius: 28px;
    margin: 0 auto 32px;
    box-shadow: 0 20px 48px -8px rgba(239, 68, 68, 0.5);
}
h1 {
    font-size: 64px;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 16px;
}
h1 span {
    background: linear-gradient(135deg, #ef4444, #f97316);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
p {
    font-size: 24px;
    color: #64748b;
    max-width: 700px;
    margin: 0 auto;
    line-height: 1.5;
}
.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    border-radius: 100px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    color: #dc2626;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 24px;
}
.badge::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
}
</style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="content">
    <div class="badge">Akses Premium AI</div>
    <img src="/ultr-icons.png" alt="UltrAI" class="logo">
    <h1>Akses AI Premium<br><span>Harga UMKM.</span></h1>
    <p>50+ Model AI · Unlimited Usage · Mulai Rp 5.000/hari</p>
</div>
</body>
</html>
