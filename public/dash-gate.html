<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltrAI Dashboard — Login Required</title>
    <link rel="icon" type="image/png" href="https://ultrai.id/ultr-icons.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fafbfc;font-family:'Inter',-apple-system,sans-serif;overflow:hidden;position:relative}
        .bg-dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(239,68,68,0.08) 1px,transparent 1px);background-size:28px 28px;opacity:.8}
        .glow{position:absolute;border-radius:50%;filter:blur(130px);pointer-events:none}
        .glow-1{top:-20%;left:50%;transform:translateX(-50%);width:650px;height:650px;background:rgba(239,68,68,0.12);animation:pulse-glow 5s ease-in-out infinite}
        .glow-2{bottom:-25%;right:-10%;width:450px;height:450px;background:rgba(251,146,60,0.1);animation:pulse-glow 6s ease-in-out infinite 1.5s}
        .particles span{position:absolute;border-radius:50%;animation:particle 5s ease-in-out infinite}
        .particles span:nth-child(1){width:6px;height:6px;background:#ef4444;top:12%;left:18%;animation-delay:0s}
        .particles span:nth-child(2){width:4px;height:4px;background:#f97316;top:22%;right:12%;animation-delay:.6s}
        .particles span:nth-child(3){width:8px;height:8px;background:#dc2626;bottom:18%;left:12%;animation-delay:1.2s}
        .particles span:nth-child(4){width:5px;height:5px;background:#fb923c;bottom:25%;right:18%;animation-delay:1.8s}
        .particles span:nth-child(5){width:7px;height:7px;background:#ef4444;top:55%;left:6%;animation-delay:2.4s}
        .particles span:nth-child(6){width:3px;height:3px;background:#f97316;top:35%;right:6%;animation-delay:3s}
        .container{position:relative;text-align:center;max-width:460px;padding:2rem;z-index:1;animation:fade-up .8s ease-out both}
        .logo-wrap{margin-bottom:1.5rem;animation:fade-up .6s ease-out both .1s}
        .logo-img{width:72px;height:72px;border-radius:20px;box-shadow:0 20px 48px -8px rgba(239,68,68,0.45),0 0 0 1px rgba(255,255,255,0.8) inset;animation:float 5s ease-in-out infinite;margin:0 auto 1rem}
        .logo-text{font-size:1.75rem;font-weight:900;letter-spacing:-0.03em}
        .logo-text span:first-child{color:#0f172a}
        .logo-text span:last-child{background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{font-size:.8rem;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.12em;margin-bottom:2rem;animation:fade-up .6s ease-out both .2s}
        .card{background:rgba(255,255,255,0.95);border:1px solid rgba(15,23,42,0.08);border-radius:1.75rem;padding:2.5rem 2rem;backdrop-filter:blur(20px);box-shadow:0 32px 64px -16px rgba(15,23,42,0.12),0 8px 24px -8px rgba(239,68,68,0.08);animation:scale-in .5s cubic-bezier(0.34,1.56,0.64,1) both .3s;position:relative;overflow:hidden}
        .card::before{content:'';position:absolute;inset:-1px;border-radius:1.75rem;padding:1px;background:linear-gradient(135deg,rgba(239,68,68,0.3),transparent,rgba(251,146,60,0.2));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
        .card-beam{position:absolute;inset:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#ef4444,transparent);background-size:200% 100%;animation:beam-slide 3s linear infinite}
        .shield{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#ef4444,#dc2626);margin-bottom:1.5rem;box-shadow:0 16px 36px -8px rgba(239,68,68,0.5);animation:bounce-icon 3s ease-in-out infinite}
        .shield svg{width:32px;height:32px;color:white}
        .title{font-size:1.4rem;font-weight:900;color:#0f172a;margin-bottom:.5rem}
        .desc{font-size:.9rem;color:#64748b;line-height:1.7;margin-bottom:2rem}
        .btn{display:inline-flex;align-items:center;gap:.5rem;width:100%;justify-content:center;padding:1rem 2rem;border-radius:14px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-weight:700;font-size:.9rem;text-decoration:none;transition:all .3s ease;box-shadow:0 12px 28px -6px rgba(239,68,68,0.45);border:none;cursor:pointer;position:relative;overflow:hidden}
        .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);transform:translateX(-100%);transition:transform .6s ease}
        .btn:hover{transform:translateY(-3px);box-shadow:0 18px 40px -8px rgba(239,68,68,0.6)}
        .btn:hover::after{transform:translateX(100%)}
        .btn:active{transform:translateY(-1px) scale(0.98)}
        .spinner{display:none;width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
        .btn.loading .spinner{display:inline-block}
        .btn.loading .btn-text{display:none}
        .btn.loading::after{display:none}
        .status{margin-top:1.25rem;font-size:.8rem;color:#64748b;min-height:20px;transition:all .3s}
        .status.error{color:#dc2626;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);padding:.75rem 1rem;border-radius:12px;margin-top:1rem;animation:shake .4s ease}
        .status.success{color:#059669;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.15);padding:.75rem 1rem;border-radius:12px;margin-top:1rem}
        .footer{margin-top:2rem;font-size:.75rem;color:#94a3b8;animation:fade-up .6s ease-out both .6s}
        .footer a{color:#ef4444;text-decoration:none;font-weight:600}
        .footer a:hover{text-decoration:underline}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        @keyframes pulse-glow{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
        @keyframes bounce-icon{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(2deg)}}
        @keyframes particle{0%,100%{transform:translate(0,0) scale(1);opacity:.3}25%{transform:translate(8px,-12px) scale(1.2);opacity:.7}50%{transform:translate(-4px,-20px) scale(.9);opacity:.5}75%{transform:translate(6px,-8px) scale(1.1);opacity:.4}}
        @keyframes fade-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes scale-in{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes beam-slide{0%{background-position:-200% 0}100%{background-position:200% 0}}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
    </style>
</head>
<body>
    <div class="bg-dots"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="particles"><span></span><span></span><span></span><span></span><span></span><span></span></div>

    <div class="container">
        <div class="logo-wrap">
            <img src="https://ultrai.id/ultr-icons.png" alt="UltrAI" class="logo-img" width="72" height="72">
            <div class="logo-text"><span>Ultr</span><span>AI</span></div>
        </div>
        <div class="subtitle">Admin Dashboard</div>

        <div class="card">
            <div class="card-beam"></div>
            <div class="shield">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
            </div>
            <h1 class="title">Akses Terbatas</h1>
            <p class="desc">Dashboard ini hanya untuk administrator UltrAI. Silakan login terlebih dahulu untuk melanjutkan.</p>

            <button id="loginBtn" class="btn" onclick="startAuth()">
                <span class="btn-text">Login sebagai Admin</span>
                <span class="spinner"></span>
            </button>

            <div id="status" class="status"></div>
        </div>

        <div class="footer">
            Bukan admin? <a href="https://ultrai.id">Kembali ke UltrAI</a>
        </div>
    </div>

    <script>
        (function() {
            fetch('https://ultrai.id/api/dash/verify', {
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            })
            .then(function(r) {
                if (r.ok) { window.location.reload(); }
            })
            .catch(function() {});
        })();

        function startAuth() {
            var btn = document.getElementById('loginBtn');
            var status = document.getElementById('status');
            btn.classList.add('loading');
            status.textContent = '';
            status.className = 'status';

            fetch('https://ultrai.id/api/dash/verify', {
                credentials: 'include',
                headers: { 'Accept': 'application/json' }
            })
            .then(function(r) {
                if (r.ok) {
                    return r.json().then(function(data) {
                        status.textContent = 'Berhasil! Mengalihkan...';
                        status.className = 'status success';
                        setTimeout(function() { window.location.reload(); }, 500);
                    });
                } else {
                    window.location.href = 'https://ultrai.id/login?redirect=dash';
                }
            })
            .catch(function() {
                window.location.href = 'https://ultrai.id/login?redirect=dash';
            });
        }
    </script>
</body>
</html>
