name: Dashboard QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      AI_PROXY_URL: http://127.0.0.1:1
      AI_PROXY_KEY: ''
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify frontend, backend, build and real browser workflows
        run: npm run qa

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: xsuper_pg_test
          POSTGRES_USER: xsuper_pg_test
          POSTGRES_PASSWORD: xsuper-ci-test-only
        ports:
          - 2209:5432
        options: >-
          --health-cmd "pg_isready -U xsuper_pg_test -d xsuper_pg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ULTRAI_DATABASE_TEST_PROFILE: postgres
      ULTRAI_PG_TEST_PASSWORD: xsuper-ci-test-only
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '2209'
      DB_DATABASE: xsuper_pg_test
      DB_USERNAME: xsuper_pg_test
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      AI_PROXY_URL: http://127.0.0.1:1
      AI_PROXY_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Build frontend assets for feature responses
        run: npm run build
      - name: Verify full Unit and Feature suites on PostgreSQL
        run: php vendor/bin/phpunit --configuration phpunit.postgres.xml
