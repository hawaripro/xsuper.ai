<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltrAI API — Private Gateway</title>
    <link rel="icon" type="image/png" href="https://ultrai.id/ultr-icons.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fafbfc;font-family:'Inter',-apple-system,sans-serif;overflow:hidden;position:relative}
        .bg-dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(239,68,68,0.08) 1px,transparent 1px);background-size:28px 28px;opacity:.7}
        .glow{position:absolute;border-radius:50%;filter:blur(130px);pointer-events:none}
        .glow-1{top:-18%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:rgba(239,68,68,0.12);animation:pulse-glow 5s ease-in-out infinite}
        .glow-2{bottom:-22%;right:-8%;width:400px;height:400px;background:rgba(251,146,60,0.1);animation:pulse-glow 6s ease-in-out infinite 1.5s}
        .particles span{position:absolute;border-radius:50%;animation:particle 5s ease-in-out infinite}
        .particles span:nth-child(1){width:6px;height:6px;background:#ef4444;top:14%;left:16%;animation-delay:0s}
        .particles span:nth-child(2){width:4px;height:4px;background:#f97316;top:20%;right:14%;animation-delay:.7s}
        .particles span:nth-child(3){width:8px;height:8px;background:#dc2626;bottom:16%;left:10%;animation-delay:1.4s}
        .particles span:nth-child(4){width:5px;height:5px;background:#fb923c;bottom:28%;right:16%;animation-delay:2.1s}
        .container{position:relative;text-align:center;max-width:480px;padding:2rem;z-index:1;animation:fade-up .8s ease-out both}
        .logo-wrap{margin-bottom:1.5rem;animation:fade-up .6s ease-out both .1s}
        .logo-img{width:72px;height:72px;border-radius:20px;box-shadow:0 20px 48px -8px rgba(239,68,68,0.45);animation:float 5s ease-in-out infinite;margin:0 auto 1rem}
        .logo-text{font-size:1.75rem;font-weight:900;letter-spacing:-0.03em}
        .logo-text span:first-child{color:#0f172a}
        .logo-text span:last-child{background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.18);font-size:.7rem;font-weight:700;color:#dc2626;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2rem;animation:fade-up .6s ease-out both .2s}
        .badge-dot{width:6px;height:6px;border-radius:50%;background:#ef4444;animation:ping 2s ease-in-out infinite}
        .card{background:rgba(255,255,255,0.95);border:1px solid rgba(15,23,42,0.08);border-radius:1.75rem;padding:2.5rem 2rem;backdrop-filter:blur(20px);box-shadow:0 32px 64px -16px rgba(15,23,42,0.12),0 8px 24px -8px rgba(239,68,68,0.06);animation:scale-in .5s cubic-bezier(0.34,1.56,0.64,1) both .3s;position:relative;overflow:hidden}
        .card::before{content:'';position:absolute;inset:-1px;border-radius:1.75rem;padding:1px;background:linear-gradient(135deg,rgba(239,68,68,0.25),transparent 50%,rgba(251,146,60,0.2));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
        .card-beam{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ef4444,transparent);background-size:200% 100%;animation:beam-slide 3s linear infinite}
        .icon-box{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#ef4444,#dc2626);margin-bottom:1.5rem;box-shadow:0 16px 36px -8px rgba(239,68,68,0.5);animation:bounce-icon 3s ease-in-out infinite}
        .icon-box svg{width:32px;height:32px;color:white}
        .title{font-size:1.4rem;font-weight:900;color:#0f172a;margin-bottom:.5rem}
        .desc{font-size:.9rem;color:#64748b;line-height:1.7;margin-bottom:2rem}
        .info{display:flex;flex-direction:column;gap:0}
        .info-row{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:1px solid rgba(15,23,42,0.06)}
        .info-row:last-child{border:none}
        .info-label{font-size:.8rem;font-weight:600;color:#64748b}
        .info-value{font-size:.8rem;color:#0f172a;font-family:'JetBrains Mono',monospace;font-weight:500}
        .status{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:#059669}
        .status-dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 12px rgba(16,185,129,0.6);animation:ping 2s ease-in-out infinite}
        .restricted{color:#dc2626;background:rgba(239,68,68,0.08);padding:2px 8px;border-radius:6px;border:1px solid rgba(239,68,68,0.15)}
        .footer{margin-top:2rem;font-size:.75rem;color:#94a3b8;animation:fade-up .6s ease-out both .6s}
        .footer a{color:#ef4444;text-decoration:none;font-weight:600}
        .footer a:hover{text-decoration:underline}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        @keyframes pulse-glow{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
        @keyframes bounce-icon{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
        @keyframes particle{0%,100%{transform:translate(0,0) scale(1);opacity:.3}25%{transform:translate(8px,-12px) scale(1.2);opacity:.7}50%{transform:translate(-4px,-20px) scale(.9);opacity:.5}75%{transform:translate(6px,-8px) scale(1.1);opacity:.4}}
        @keyframes fade-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes scale-in{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
        @keyframes beam-slide{0%{background-position:-200% 0}100%{background-position:200% 0}}
        @keyframes ping{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
    </style>
</head>
<body>
    <div class="bg-dots"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="particles"><span></span><span></span><span></span><span></span></div>
    <div class="container">
        <div class="logo-wrap">
            <img src="https://ultrai.id/ultr-icons.png" alt="UltrAI" class="logo-img" width="72" height="72">
            <div class="logo-text"><span>Ultr</span><span>AI</span></div>
        </div>
        <div class="badge"><span class="badge-dot"></span>API Gateway</div>
        <div class="card">
            <div class="card-beam"></div>
            <div class="icon-box">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
                </svg>
            </div>
            <h1 class="title">Private API</h1>
            <p class="desc">API ini bersifat privat dan hanya dapat diakses oleh sistem internal UltrAI. Akses publik tidak diizinkan.</p>
            <div class="info">
                <div class="info-row">
                    <span class="info-label">Status</span>
                    <span class="status"><span class="status-dot"></span>Operational</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Access</span>
                    <span class="info-value restricted">Restricted</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Auth</span>
                    <span class="info-value">Bearer Token</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Endpoint</span>
                    <span class="info-value">api.ultrai.id</span>
                </div>
            </div>
        </div>
        <div class="footer">&copy; 2026 UltrAI &middot; <a href="https://ultrai.id">ultrai.id</a></div>
    </div>
</body>
</html>
