<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Forbidden | UltrAI API</title>
    <link rel="icon" type="image/png" href="https://ultrai.id/ultr-icons.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fafbfc;font-family:'Inter',-apple-system,sans-serif;overflow:hidden;position:relative}
        .bg-dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(239,68,68,0.08) 1px,transparent 1px);background-size:28px 28px;opacity:.7}
        .glow{position:absolute;border-radius:50%;filter:blur(130px);pointer-events:none}
        .glow-1{top:-18%;left:50%;transform:translateX(-50%);width:600px;height:600px;background:rgba(239,68,68,0.12);animation:pulse-glow 5s ease-in-out infinite}
        .glow-2{bottom:-22%;right:-8%;width:400px;height:400px;background:rgba(251,146,60,0.1);animation:pulse-glow 6s ease-in-out infinite 1.5s}
        .particles span{position:absolute;border-radius:50%;animation:particle 5s ease-in-out infinite}
        .particles span:nth-child(1){width:6px;height:6px;background:#ef4444;top:14%;left:18%;animation-delay:0s}
        .particles span:nth-child(2){width:4px;height:4px;background:#f97316;top:22%;right:14%;animation-delay:.7s}
        .particles span:nth-child(3){width:8px;height:8px;background:#dc2626;bottom:18%;left:12%;animation-delay:1.4s}
        .particles span:nth-child(4){width:5px;height:5px;background:#fb923c;bottom:28%;right:18%;animation-delay:2.1s}
        .container{position:relative;text-align:center;max-width:480px;padding:2rem;z-index:1;animation:fade-up .8s ease-out both}
        .error-num{position:relative;margin-bottom:1.5rem}
        .error-num .bg-num{font-size:clamp(130px,28vw,220px);font-weight:900;letter-spacing:-0.05em;line-height:1;background:linear-gradient(135deg,#ef4444,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:.12;animation:float 6s ease-in-out infinite;user-select:none}
        .error-num .fg-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(70px,16vw,130px);font-weight:900;letter-spacing:-0.04em;background:linear-gradient(135deg,#ef4444,#f97316,#ef4444);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow-text 3s ease-in-out infinite,gradient-shift 4s ease infinite}
        .icon-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#ef4444,#dc2626);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 44px -10px rgba(239,68,68,0.5);animation:bounce-icon 2.5s ease-in-out infinite,shake 5s ease-in-out infinite}
        .icon-box svg{width:32px;height:32px;color:white}
        h1{font-size:1.5rem;font-weight:900;color:#0f172a;margin-bottom:8px;animation:fade-up .6s ease-out both .2s}
        p{font-size:.9rem;color:#64748b;margin-bottom:2rem;line-height:1.7;animation:fade-up .6s ease-out both .35s}
        .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fade-up .6s ease-out both .5s}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:14px;font-size:.875rem;font-weight:700;text-decoration:none;transition:all .25s ease}
        .btn-primary{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 12px 28px -6px rgba(239,68,68,0.45)}
        .btn-primary:hover{transform:translateY(-3px);box-shadow:0 18px 36px -6px rgba(239,68,68,0.55)}
        .btn-ghost{background:#fff;color:#334155;border:1.5px solid #e2e8f0;box-shadow:0 4px 12px -2px rgba(15,23,42,0.06)}
        .btn-ghost:hover{transform:translateY(-2px);border-color:#cbd5e1;box-shadow:0 8px 20px -4px rgba(15,23,42,0.1)}
        .footer{margin-top:2rem;font-size:.75rem;color:#94a3b8;animation:fade-up .6s ease-out both .6s}
        .footer a{color:#ef4444;text-decoration:none;font-weight:600}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
        @keyframes glow-text{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
        @keyframes gradient-shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        @keyframes bounce-icon{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-8px)}}
        @keyframes shake{0%,88%,100%{transform:translate(-50%,-50%) rotate(0)}90%{transform:translate(-50%,-50%) rotate(-3deg)}92%{transform:translate(-50%,-50%) rotate(3deg)}94%{transform:translate(-50%,-50%) rotate(-2deg)}96%{transform:translate(-50%,-50%) rotate(1deg)}}
        @keyframes pulse-glow{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
        @keyframes particle{0%,100%{transform:translate(0,0) scale(1);opacity:.3}25%{transform:translate(8px,-12px) scale(1.2);opacity:.7}50%{transform:translate(-4px,-20px) scale(.9);opacity:.5}75%{transform:translate(6px,-8px) scale(1.1);opacity:.4}}
        @keyframes fade-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
    </style>
</head>
<body>
    <div class="bg-dots"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="particles"><span></span><span></span><span></span><span></span></div>
    <div class="container">
        <div class="error-num">
            <div class="bg-num">403</div>
            <div class="fg-num">403</div>
            <div class="icon-box">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
        </div>
        <h1>Akses Ditolak</h1>
        <p>Kamu tidak punya izin untuk mengakses endpoint ini. Pastikan API key atau token kamu valid.</p>
        <div class="actions">
            <a href="https://ultrai.id" class="btn btn-primary">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                UltrAI
            </a>
            <a href="javascript:history.back()" class="btn btn-ghost">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                Kembali
            </a>
        </div>
        <div class="footer">&copy; 2026 UltrAI API &middot; <a href="https://ultrai.id">ultrai.id</a></div>
    </div>
</body>
</html>
